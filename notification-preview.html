<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violator Notification Preview</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --soft: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --amber: #f59e0b;
        --red: #ef4444;
        --green: #22c55e;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(135deg, #0b1020, #111827);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 30px;
      }

      .phone {
        width: min(420px, 100%);
        background: linear-gradient(180deg, #111827, #0f172a);
        border: 1px solid rgba(148,163,184,0.4);
        border-radius: 24px;
        box-shadow: 0 22px 60px rgba(0,0,0,0.35);
        overflow: hidden;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px 10px;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(15,23,42,0.9);
      }

      .phone-body {
        padding: 18px 18px 22px;
      }

      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand {
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .badge {
        font-size: 0.6rem;
        padding: 5px 8px;
        border-radius: 999px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .badge.warn { background: rgba(245,158,11,.14); color: #fbbf24; border: 1px solid rgba(245,158,11,.35); }
      .badge.danger { background: rgba(239,68,68,.14); color: #fca5a5; border: 1px solid rgba(239,68,68,.35); }
      .badge.success { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.35); }

      .title {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.3;
      }

      .message-box {
        background: rgba(15,23,42,0.9);
        border: 1px solid rgba(148,163,184,0.25);
        border-radius: 16px;
        padding: 16px;
        margin-top: 18px;
      }

      .timestamp {
        color: var(--muted);
        font-size: 0.7rem;
        margin-bottom: 12px;
      }

      .notice {
        line-height: 1.7;
        color: #e2e8f0;
        font-size: 0.95rem;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .action-btn {
        padding: 12px 14px;
        border-radius: 12px;
        border: none;
        background: #2563eb;
        color: white;
        font-weight: 700;
      }

      .action-btn.secondary {
        background: rgba(37,99,235,0.12);
        color: #bfdbfe;
        border: 1px solid rgba(96,165,250,0.4);
      }

      .small-text {
        color: var(--muted);
        font-size: 0.7rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="status-bar">
        <span>09:41</span>
        <span>RTVN</span>
      </div>

      <div class="phone-body">
        <div class="app-header">
          <div class="brand">Vehicle Alert</div>
          <span id="severityBadge" class="badge warn">Warning</span>
        </div>

        <h1 id="headline" class="title">Violation Alert</h1>

        <div class="message-box">
          <div id="timestamp" class="timestamp">--:--</div>
          <div id="noticeText" class="notice">
            No notification yet.
          </div>
        </div>

        <div class="actions">
          <button class="action-btn">Acknowledge</button>
          <button class="action-btn secondary">View Full Notice</button>
        </div>

        <p class="small-text">
          Connected to Connected Vehicle / Smartphone Push Terminal.<br>
          Future integration: Android Auto, CarPlay, and in-vehicle infotainment.
        </p>
      </div>
    </div>

    <script src="./js/notification-preview.js"></script>
  </body>
</html>
